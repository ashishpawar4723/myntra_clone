name: myntra-prod-b21

on: workflow_dispatch

jobs:
    my-job:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v2

            - name: docker build
              run: docker build -t my-myntra .

            - name: check docker image
              run: docker images
            
            - name: configure aws keys
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1

            - name: push docker image to ECR
              run: |
                aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 456769503748.dkr.ecr.ap-south-1.amazonaws.com.dkr.ecr.us-east-1.amazonaws.com
                docker tag my-myntra:latest 456769503748.dkr.ecr.ap-south-1.amazonaws.com.dkr.ecr.us-east-1.amazonaws.com/my-myntra:latest
                docker push 456769503748.dkr.ecr.ap-south-1.amazonaws.com.dkr.ecr.us-east-1.amazonaws.com/my-myntra:latest






    

    


